name: Build and publish Docker images

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

# A tag publication must finish both pushes and its release manifest together.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked test dependencies
        run: |
          python -m pip install uv==0.12.9
          uv sync --project backend --frozen --extra dev --extra ocr
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Test backend and cross-stack calculation contract
        working-directory: backend
        run: uv run --frozen --extra dev --extra ocr pytest -n 4
      - name: Lint backend and model downloader
        working-directory: backend
        run: uv run --frozen --extra dev ruff check app tests migrations scripts

  frontend:
    name: Frontend tests, lint and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm test && npm run lint && npm run build
        working-directory: frontend
      - name: Check Nginx policy
        run: sh scripts/check-nginx-policy.sh

  pull-request-images:
    name: Verify PR images without registry credentials
    if: github.event_name == 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Add excluded environment canaries
        run: |
          for directory in . backend frontend; do
            printf '%s\n' 'EXPENSE_CI_ENV_CANARY=never-bake-runtime-credentials-9c02e28f' > "$directory/.env.ci-canary"
          done
      - name: Build final backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: expense-backend:ci
          cache-from: type=gha,scope=backend-amd64
          cache-to: type=gha,mode=max,scope=backend-amd64
      - name: Build final Web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: expense-web:ci
          cache-from: type=gha,scope=web-amd64
          cache-to: type=gha,mode=max,scope=web-amd64
      - name: Verify offline OCR and final image integration
        run: bash scripts/smoke-images.sh expense-backend:ci expense-web:ci

  images:
    name: Verify and publish the same final images
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate publication ref and image names
        id: names
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_PROTECTED" == true ]] || { echo 'Version tags must be protected by a repository ruleset.' >&2; exit 1; }
            [[ "$REF_NAME" =~ ^v[A-Za-z0-9_.-]{0,127}$ ]] || { echo 'Version tag is not a valid Docker tag.' >&2; exit 1; }
          fi
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf 'backend=ghcr.io/%s-backend\n' "$repository" >> "$GITHUB_OUTPUT"
          printf 'web=ghcr.io/%s-web\n' "$repository" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Add excluded environment canaries
        run: |
          for directory in . backend frontend; do
            printf '%s\n' 'EXPENSE_CI_ENV_CANARY=never-bake-runtime-credentials-9c02e28f' > "$directory/.env.ci-canary"
          done
      - name: Build final backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: expense-backend:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend-amd64
          cache-to: type=gha,mode=max,scope=backend-amd64
      - name: Build final Web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: expense-web:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web-amd64
          cache-to: type=gha,mode=max,scope=web-amd64
      - name: Verify offline OCR and final image integration
        run: bash scripts/smoke-images.sh expense-backend:ci expense-web:ci
      - name: Log in to GHCR after all checks pass
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested images and write release manifest
        env:
          BACKEND_REPOSITORY: ${{ steps.names.outputs.backend }}
          WEB_REPOSITORY: ${{ steps.names.outputs.web }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          for service in backend web; do
            if [[ "$service" == backend ]]; then repository="$BACKEND_REPOSITORY"; else repository="$WEB_REPOSITORY"; fi
            docker tag "expense-$service:ci" "$repository:sha-$GITHUB_SHA"
            if [[ "$REF_TYPE" == branch && "$REF_NAME" == main ]]; then
              docker tag "expense-$service:ci" "$repository:main"
            fi
            if [[ "$REF_TYPE" == tag ]]; then
              docker tag "expense-$service:ci" "$repository:$REF_NAME"
            fi
            docker push --all-tags "$repository"
          done
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          release = {
              "revision": os.environ["GITHUB_SHA"],
              "source": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}",
              "model_manifest_sha256": hashlib.sha256(
                  Path("backend/app/ocr/model_manifest.json").read_bytes()
              ).hexdigest(),
          }
          for service in ("backend", "web"):
              repository = os.environ[f"{service.upper()}_REPOSITORY"]
              tagged = f"{repository}:sha-{release['revision']}"
              local = json.loads(subprocess.check_output(["docker", "image", "inspect", tagged]))[0]
              refs = [ref for ref in local["RepoDigests"] if ref.startswith(repository + "@")]
              if len(refs) != 1 or not re.fullmatch(re.escape(repository) + r"@sha256:[0-9a-f]{64}", refs[0]):
                  raise SystemExit(f"Expected one pushed digest for {service}")
              remote = json.loads(subprocess.check_output([
                  "docker", "buildx", "imagetools", "inspect", "--raw", refs[0]
              ]))
              if remote.get("config", {}).get("digest") != local["Id"]:
                  raise SystemExit(f"Pushed {service} digest differs from the tested image")
              release[f"{service}_image"] = refs[0]
          Path("release.json").write_text(json.dumps(release, indent=2) + "\n")
          PY
      - name: Retain the published image manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: release.json
          if-no-files-found: error
          retention-days: 90
