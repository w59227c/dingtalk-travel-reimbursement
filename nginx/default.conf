# This Nginx instance is the same-origin application boundary. It can be used
# directly over HTTP or placed behind an HTTP/HTTPS reverse proxy.
server_tokens off;

client_body_temp_path /var/cache/nginx/client_temp 1 2;
proxy_temp_path /var/cache/nginx/proxy_temp 1 2;

map $request_uri $expense_cache_control {
    default "no-store";
    "~^/assets/.+-[A-Za-z0-9_-]{8,}\.[A-Za-z0-9]+(?:\?.*)?$" "public, max-age=31536000, immutable";
}

map $http_x_forwarded_proto $expense_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 8080;
    server_name _;

    # Query strings may contain sensitive user input. The backend emits a
    # structured request log with the URL path only, so the default Nginx
    # access log is intentionally disabled.
    access_log off;

    root /usr/share/nginx/html;
    index index.html;

    # One request contains one file. This leaves multipart headroom above the
    # backend's authoritative 20 MiB per-file limit.
    client_max_body_size 25m;

    add_header Cache-Control $expense_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.dingtalk.com; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://*.dingtalk.com https://*.dingcloud.com" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location ~ ^/api/reimbursements/drafts/[^/]+/files$ {
        # Persistent reimbursement uploads use the same one-file streaming
        # contract and must not consume the small Nginx client temp tmpfs.
        proxy_request_buffering off;
        include /etc/nginx/conf.d/expense-proxy.inc;
    }

    location /api/ {
        include /etc/nginx/conf.d/expense-proxy.inc;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
